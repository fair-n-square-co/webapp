name: CI

on:
  push:
    branches: [main]
  pull_request:

# `@fair-n-square-co/apis` comes from GitHub Packages, which is private, so every
# `bun install` needs a token that can read it (see .npmrc). The built-in token is
# enough, provided the `apis` package grants this repo read access.
permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test

      # Also regenerates src/routeTree.gen.ts through the TanStack Start plugin.
      - run: bun run build

      - name: Verify the committed route tree is up to date
        run: |
          if ! git diff --exit-code -- src/routeTree.gen.ts; then
            echo "::error file=src/routeTree.gen.ts::Route tree is stale. Run 'bun run build' and commit src/routeTree.gen.ts."
            exit 1
          fi

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
